<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS Portal — System Status &amp; Klantsupport</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --surface: #ffffff;
      --border: #dfe5f0;
      --text: #141820;
      --text-muted: #5c6473;
      --primary: #2554a6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e131b;
        --surface: #161d28;
        --border: #2c3648;
        --text: #eef2f8;
        --text-muted: #a1acb9;
        --primary: #8ab4f8;
      }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .panel {
      max-width: 560px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 22px;
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    a.card-link {
      display: block;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
    }
    a.card-link strong {
      display: block;
      color: var(--primary);
      font-size: 15px;
      margin-bottom: 4px;
    }
    a.card-link span {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }
    a.card-link:hover {
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>AEGIS Trust &amp; Support Portal</h1>
    <p>Select a public endpoint for AEGIS (<code>com.aistudio.aegis.assistant</code>):</p>
    <div class="actions">
      <a class="card-link" href="./status.html">
        <strong>System Status URL</strong>
        <span>Service availability, Room &amp; Vault telemetry</span>
      </a>
      <a class="card-link" href="./klantsupport.html">
        <strong>Klantsupport URL</strong>
        <span>Customer support desk (NL / EN), FAQ &amp; email</span>
      </a>
    </div>
  </main>
</body>
</html>
