name: Build Android App Bundle
on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    name: Build bundle
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Optional: if you prefer to provide a base64-encoded keystore via secrets
      # set KEYSTORE_BASE64 to the base64 string of your upload keystore.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decode upload keystore (if provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "Decoding keystore from secret KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Gradle (if no Gradle wrapper present)
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Gradle wrapper not found — installing Gradle via SDKMAN"
            curl -s "https://get.sdkman.io" | bash
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk install gradle 8.4.1
          else
            echo "Gradle wrapper found, will use ./gradlew"
          fi

      - name: Build app bundle (Release)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:bundleRelease --no-daemon --stacktrace
          else
            gradle :app:bundleRelease --no-daemon --stacktrace
          fi
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-release
          path: app/build/outputs/bundle/release/*.aab
